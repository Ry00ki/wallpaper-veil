name: Wallpaper Veil checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wallpaper-veil-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q WallpaperVeil
      - name: Run runtime and package provenance rejection tests
        run: python -m unittest discover -s WallpaperVeil/tests -p 'test_*.py' -v
      - name: Install Lua 5.4 parser
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y lua5.4
      - name: Parse Lua sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          files = sorted(Path('WallpaperVeil').rglob('*.lua'))
          if not files:
              raise SystemExit('No Wallpaper Veil Lua sources found')
          for path in files:
              subprocess.run(['luac5.4', '-p', str(path)], check=True)
          print(f'Parsed {len(files)} Lua files with Lua 5.4')
          PY
      - name: Run Lua regression tests
        run: |
          python - <<'PYTEST'
          from pathlib import Path
          import subprocess
          for path in sorted(Path('WallpaperVeil/tests').glob('test_*.lua')):
              subprocess.run(['lua5.4', str(path)], check=True)
          PYTEST
